<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gen Xodus — News for Gen X</title>
  <style>
    body { margin:0; font-family: ui-serif, Georgia, serif; background:#fcfcfa; color:#101418; }
    a { color:#0a58ca; text-underline-offset:2px; }
    .wrap { max-width:1200px; margin:0 auto; padding:16px; }
    .masthead { text-align:center; margin:16px 0 8px; }
    .site-title { font-family: Courier New, monospace; font-weight:800; letter-spacing:2px; font-size:clamp(32px,7vw,72px); text-transform:uppercase; }
    .sublabel { color:#667085; font-size:14px; margin-top:6px; }
    .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; }
    @media (max-width:980px){ .grid { grid-template-columns:1fr; } }
    .card { background:#fff; border:1px solid #e6e6e6; border-radius:12px; padding:12px; }
    .col-title { font-family: Courier New, monospace; font-size:14px; letter-spacing:1px; text-transform:uppercase; margin:4px 0 10px; }
    /* Category-specific colors */
    .col-title.politics { color:#b22222; }
    .col-title.finance { color:#006400; }
    .col-title.tech { color:#1e90ff; }
    .col-title.culture { color:#8b008b; }
    .col-title.sports { color:#ff8c00; }
    .col-title.health { color:#2f4f4f; }
    .col-title.spirituality { color:#daa520; }
    ul { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
    .ad { margin:20px auto; text-align:center; border:1px dashed #ccc; padding:8px; border-radius:8px; font-size:12px; color:#666; }
    footer { text-align:center; color:#667085; font-size:13px; padding:24px 0 40px; }
  </style>
  <!-- Global AdSense script load (replace pub ID once approved) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXX"
     crossorigin="anonymous"></script>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="site-title" id="siteTitle">Gen Xodus</div>
      <div class="sublabel"><span id="today"></span> · <span id="tagline">News & links for U.S. Gen X</span></div>
    </header>

    <!-- Top Banner Ad -->
    <div class="ad ad-top">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXX"
           data-ad-slot="1111111111"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <main class="grid" id="grid"></main>

    <!-- Mid Content Ad -->
    <div class="ad ad-mid">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXX"
           data-ad-slot="2222222222"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <footer>
      <!-- Footer Ad -->
      <div class="ad ad-footer">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXX"
             data-ad-slot="3333333333"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
      © <span id="year"></span> Gen Xodus
    </footer>
  </div>

  <script>
    const linkItem = (item) => `<li><a href="${item.url}" target="_blank" rel="noopener">${item.text}</a></li>`;
    function render(cfg){
      document.getElementById('siteTitle').textContent = cfg.siteTitle || 'Gen Xodus';
      document.getElementById('tagline').textContent = cfg.tagline || 'News & links for U.S. Gen X';
      const grid = document.getElementById('grid');
      grid.innerHTML = (cfg.categories||[]).map(cat => (
        `<section class="card">
           <div class="col-title ${cat.name.toLowerCase()}">${cat.name}</div>
           <ul>${(cat.items||[]).map(linkItem).join('')}</ul>
         </section>`
      )).join('');
    }

    (async () => {
      document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
      document.getElementById('year').textContent = new Date().getFullYear();
      try {
        const res = await fetch('config.json', {cache:'no-store'});
        if (!res.ok) throw new Error('HTTP '+res.status);
        const cfg = await res.json();
        render(cfg);
      } catch(e){
        console.error('Error loading config.json:', e);
      }
    })();
  </script>
</body>
</html>
